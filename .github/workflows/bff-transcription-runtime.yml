name: BFF Transcription Runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-small-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install downloader
        run: |
          set -euo pipefail
          python -m pip install huggingface_hub==0.34.4

      - name: Download Faster-Whisper small
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from huggingface_hub import HfApi, snapshot_download
          api = HfApi()
          info = api.model_info('Systran/faster-whisper-small')
          print('revision', info.sha)
          snapshot_download(
              repo_id='Systran/faster-whisper-small',
              revision=info.sha,
              local_dir='fw-small',
              local_dir_use_symlinks=False,
          )
          open('revision.txt', 'w', encoding='utf-8').write(info.sha + '\n')
          PY
          test -f fw-small/model.bin
          mkdir -p small-metadata small-parts manifests
          find fw-small -maxdepth 1 -type f ! -name model.bin -exec cp {} small-metadata/ \;
          cp revision.txt small-metadata/
          split -b 240M -d -a 2 fw-small/model.bin small-parts/model.bin.part-
          sha256sum fw-small/model.bin | tee manifests/model-original.sha256
          sha256sum small-parts/* | tee manifests/model-parts.sha256
          find fw-small -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort | tee manifests/model-files.tsv
          cp revision.txt manifests/
          ls -lh small-parts

      - name: Upload small metadata
        uses: actions/upload-artifact@v4
        with:
          name: bff-faster-whisper-small-metadata
          path: small-metadata
          retention-days: 1

      - name: Upload small model part 00
        uses: actions/upload-artifact@v4
        with:
          name: bff-faster-whisper-small-part-00
          path: small-parts/model.bin.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload small model part 01
        uses: actions/upload-artifact@v4
        with:
          name: bff-faster-whisper-small-part-01
          path: small-parts/model.bin.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload small model part 02 if present
        if: ${{ hashFiles('small-parts/model.bin.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bff-faster-whisper-small-part-02
          path: small-parts/model.bin.part-02
          compression-level: 0
          retention-days: 1

      - name: Upload small checksums
        uses: actions/upload-artifact@v4
        with:
          name: bff-faster-whisper-small-checksums
          path: manifests
          retention-days: 1
