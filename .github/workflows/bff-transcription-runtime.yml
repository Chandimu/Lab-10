name: BFF Transcription Runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-model-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download whisper.cpp model helper
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git whisper.cpp

      - name: Download and split large-v3-turbo Q5 model
        run: |
          set -euo pipefail
          mkdir -p large-parts manifests
          whisper.cpp/models/download-ggml-model.sh large-v3-turbo-q5_0 .
          sha256sum ggml-large-v3-turbo-q5_0.bin | tee manifests/large-original.sha256
          split -b 300M -d -a 2 ggml-large-v3-turbo-q5_0.bin large-parts/ggml-large-v3-turbo-q5_0.bin.part-
          sha256sum large-parts/* | tee manifests/large-parts.sha256
          test -f large-parts/ggml-large-v3-turbo-q5_0.bin.part-00
          test -f large-parts/ggml-large-v3-turbo-q5_0.bin.part-01

      - name: Download and split medium Q5 comparison model
        run: |
          set -euo pipefail
          mkdir -p medium-parts
          whisper.cpp/models/download-ggml-model.sh medium-q5_0 .
          sha256sum ggml-medium-q5_0.bin | tee manifests/medium-original.sha256
          split -b 300M -d -a 2 ggml-medium-q5_0.bin medium-parts/ggml-medium-q5_0.bin.part-
          sha256sum medium-parts/* | tee manifests/medium-parts.sha256
          test -f medium-parts/ggml-medium-q5_0.bin.part-00
          test -f medium-parts/ggml-medium-q5_0.bin.part-01

      - name: Upload large model part 00
        uses: actions/upload-artifact@v4
        with:
          name: bff-large-v3-turbo-q5-part-00
          path: large-parts/ggml-large-v3-turbo-q5_0.bin.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload large model part 01
        uses: actions/upload-artifact@v4
        with:
          name: bff-large-v3-turbo-q5-part-01
          path: large-parts/ggml-large-v3-turbo-q5_0.bin.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload medium model part 00
        uses: actions/upload-artifact@v4
        with:
          name: bff-medium-q5-part-00
          path: medium-parts/ggml-medium-q5_0.bin.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload medium model part 01
        uses: actions/upload-artifact@v4
        with:
          name: bff-medium-q5-part-01
          path: medium-parts/ggml-medium-q5_0.bin.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: bff-model-checksums
          path: manifests
          retention-days: 1
